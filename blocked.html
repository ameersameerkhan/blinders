<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blinders</title>
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="blocked.css">
</head>
<body>
  <header class="bar">
    <div class="brand"><span class="mark" aria-hidden="true"></span>blinders</div>
    <div class="status" id="status"></div>
  </header>

  <main>
    <h1 id="headline">This site can wait.</h1>

    <div class="ring" id="ring">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle class="track" cx="100" cy="100" r="96"/>
        <circle class="arc" id="arc" cx="100" cy="100" r="96" pathLength="100"/>
        <g class="orbit" id="orbit"><circle class="dot" cx="100" cy="4" r="3"/></g>
      </svg>
      <div class="readout">
        <div class="time mono" id="time" aria-live="off"></div>
        <div class="unit" id="unit"></div>
      </div>
    </div>

    <div class="actions">
      <button class="btn-primary" id="primary"><span id="primary-label"></span><kbd aria-hidden="true">↵</kbd></button>
      <button class="btn-quiet" id="secondary" hidden>Close tab</button>
    </div>
  </main>

  <footer class="foot mono" id="foot"></footer>

  <script src="shared.js"></script>
  <script src="blocked.js"></script>
</body>
</html>
